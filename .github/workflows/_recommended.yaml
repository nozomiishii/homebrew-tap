name: recommended

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  # split by action so edited and synchronize runs on the same commit do not cancel each other
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action }}
  cancel-in-progress: true

permissions: {}

jobs:
  cask-api:
    name: Validate cask API generation
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate cask API metadata
        run: |
          brew --version
          brew ruby scripts/generate-cask-api.rb nozomiishii/tap

  recommended:
    permissions:
      contents: read # required by actions/checkout
      pull-requests: write # write: format revert PR titles, read: validate PR titles / list PR files (dorny/paths-filter)
      actions: read # required by zizmor persona audits and referenced_workflows resolution
    uses: nozomiishii/workflows/.github/workflows/recommended.yaml@bffe5e4f92dd5ba10497ec23353616fdcd2aa750 # v4.5.1
